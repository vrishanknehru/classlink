site_name: ClassLink
site_description: BLE-based classroom attendance system — UCS503P Software Engineering Project, TIET
site_url: https://vrishanknehru.github.io/classlink/

theme:
  name: material
  custom_dir: docs/assets/theme-overrides
  logo: assets/tiet-logo.svg
  favicon: assets/favicon.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - section-index
  - literate-nav:
      nav_file: summary.md
  - git-revision-date-localized:
      enable_creation_date: true
  - git-authors
  - mkdocstrings:
      handlers:
        python:
          paths: [code]

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
  - assets/stylesheets/extra.css

repo_url: https://github.com/vrishanknehru/classlink
repo_name: vrishanknehru/classlink
copyright: Copyright &copy; 2026 Vemula Manvi Smaran, Vrishank Nehru, Mahi Singh, Khagendra Saini
