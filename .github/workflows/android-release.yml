name: android-release

# Builds the pilot APK. Push a tag like v0.2.0 or run it by hand.
# Set these repository variables (Settings > Secrets and variables >
# Actions > Variables) so the app knows where the server is:
#   CLASSLINK_API_BASE_URL   e.g. https://classlink-api.onrender.com
#   SUPABASE_URL             e.g. https://abcd.supabase.co
#   SUPABASE_ANON_KEY        the public anon key (safe to ship in an app)
# With the four signing secrets set the APK is signed with your release key.
# Without them it falls back to the debug key, which is fine for a pilot
# sideload but not for the Play Store.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No release keystore secrets set; building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build APK
        env:
          API_BASE_URL: ${{ vars.CLASSLINK_API_BASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::CLASSLINK_API_BASE_URL is not set; the APK will point at the local dev server."
          fi
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: classlink-apk
          path: code/build/app/outputs/flutter-apk/app-release.apk
      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: code/build/app/outputs/flutter-apk/app-release.apk
