name: mkdocs

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install numpy pandas scikit-learn
      - run: pip install mkdocs-material mkdocstrings[python] mkdocs-literate-nav mkdocs-section-index mkdocs-git-revision-date-localized-plugin mkdocs-git-authors-plugin
      - run: mkdocs gh-deploy --force
